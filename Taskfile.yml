version: "3"

includes:
  backend:
    taskfile: ./apps/backend
    dir: ./apps/backend
  frontend:
    taskfile: ./apps/frontend
    dir: ./apps/frontend

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install dependencies of all apps
    cmds:
      - task: frontend:install

  dev:
    desc: Start infrastructure, backend and frontend
    cmds:
      - task: infra:up
      - task: dev:apps

  dev:apps:
    internal: true
    deps: [backend:dev, frontend:dev]

  infra:up:
    desc: Start infrastructure
    cmds:
      - docker compose up -d --wait

  infra:db:
    desc: Start the database
    cmds:
      - docker compose up -d --wait postgres

  infra:down:
    desc: Stop infrastructure
    cmds:
      - docker compose down

  infra:reset:
    desc: Stop infrastructure and delete database data
    cmds:
      - docker compose down -v

  infra:logs:
    desc: Show infrastructure logs
    cmds:
      - docker compose logs -f

  api:generate:
    desc: Generate the OpenAPI spec and the frontend client
    cmds:
      - task: infra:db
      - task: backend:openapi
      - task: frontend:api
