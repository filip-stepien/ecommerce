version: '3'

vars:
  MVNW: '{{if eq OS "windows"}}cmd /c .\\mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  dev:
    desc: Start the backend on http://localhost:8080
    cmds:
      - '{{.MVNW}} spring-boot:run'

  test:
    desc: Run backend tests
    cmds:
      - '{{.MVNW}} test'

  build:
    desc: Build the backend jar
    cmds:
      - '{{.MVNW}} package'

  openapi:
    desc: Write the OpenAPI spec to openapi/openapi.json
    cmds:
      - '{{.MVNW}} verify -Popenapi -DskipTests'
